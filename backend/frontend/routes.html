<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FERMATA | Routes</title>
    <meta name="description" content="Explore available public transport routes in Addis Ababa." />
    <link rel="icon" type="image/svg+xml" href="assets/fermata-mark.svg" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="/" class="brand"><img class="brand-mark" src="assets/fermata-mark.svg" alt="" width="42" height="42" /><span class="brand-copy"><span class="brand-name">FERMATA</span><span class="brand-tagline">Simple route.</span></span></a>
        <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="mainNav"><span class="menu-lines" aria-hidden="true"></span></button>
        <nav class="main-nav" id="mainNav" aria-label="Main navigation">
          <a href="/">Home</a>
          <a href="/stations.html">Stations</a>
          <a href="/routes.html">Routes</a>
          <a href="/about.html">About</a>
          <a href="/admin.html">Admin</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <section class="container page-header">
        <div>
          <p class="section-kicker">Network overview</p>
          <h1>Routes</h1>
        </div>
      </section>

      <section class="container route-listing-wrap">
        <div id="routesList" class="routes-list"></div>
      </section>
    </main>

    <script>
      window.APP_CONFIG = window.APP_CONFIG || {};
      window.APP_CONFIG.apiBaseUrl = window.APP_CONFIG.apiBaseUrl || 'http://localhost:5000/api';
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map.js"></script>
    <script src="js/stations.js"></script>
    <script src="js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const routesList = document.getElementById('routesList');

        const routes = (await window.transportApi.getRoutes()).data || [];

        if (!routesList) return;

        const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
        })[character]);

        routesList.innerHTML = routes.map((route) => `
          <article class="result-card route-card">
            <div class="route-option-header">
              <span class="route-badge">${escapeHtml(route.name)}</span>
              <span class="route-criteria">${escapeHtml(route.origin)} → ${escapeHtml(route.destination)}</span>
            </div>
            <p class="result-meta">${escapeHtml(route.description || 'Public transport route in Addis Ababa.')}</p>
            <div class="result-footer">
              <a href="/station.html?id=1">View route</a>
            </div>
          </article>
        `).join('');
      });
    </script>
  </body>
</html>
