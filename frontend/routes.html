<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FERMATA | Routes</title>
    <meta name="description" content="Explore available public transport routes in Addis Ababa." />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="/" class="brand"><span class="brand-mark">📍</span><span>FERMATA</span></a>
        <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="/">Map</a>
          <a href="/stations.html">Stations</a>
          <a href="/routes.html">Routes</a>
          <a href="/about.html">About</a>
          <a href="/admin.html">Admin</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <section class="container page-header">
        <div>
          <p class="section-kicker">Network overview</p>
          <h1>Routes</h1>
        </div>
      </section>

      <section class="container route-listing-wrap">
        <div id="routesList" class="routes-list"></div>
      </section>
    </main>

    <script>
      window.APP_CONFIG = window.APP_CONFIG || {};
      window.APP_CONFIG.apiBaseUrl = window.APP_CONFIG.apiBaseUrl || 'http://localhost:5000/api';
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map.js"></script>
    <script src="js/stations.js"></script>
    <script src="js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const navToggle = document.querySelector('.nav-toggle');
        const mainNav = document.querySelector('.main-nav');
        const routesList = document.getElementById('routesList');

        if (navToggle && mainNav) {
          navToggle.addEventListener('click', () => mainNav.classList.toggle('open'));
        }

        const routes = (await window.transportApi.getRoutes()).data || [];

        if (!routesList) return;

        routesList.innerHTML = routes.map((route) => `
          <article class="result-card route-card">
            <div class="route-option-header">
              <span class="route-badge">${route.name}</span>
              <span class="route-criteria">${route.origin} → ${route.destination}</span>
            </div>
            <p class="result-meta">${route.description || 'DEMO DATA route.'}</p>
            <div class="result-footer">
              <a href="/station.html?id=1">View route</a>
            </div>
          </article>
        `).join('');
      });
    </script>
  </body>
</html>
